      <circle cx="298" cy="74" r="2.5" fill="#E7746F"/><circle cx="306" cy="74" r="2.5" opacity=".4"/><circle cx="314" cy="74" r="2.5" opacity=".4"/>
      <path d="M84 92v12m0-11h9l-2 3 2 3h-9" stroke="var(--vscode-foreground, #cccccc)" stroke-width="1.4"/>
      <rect x="102" y="95.5" width="90" height="5" rx="2.5" opacity=".8"/>
      <circle cx="298" cy="98" r="2.5" opacity=".4"/><circle cx="306" cy="98" r="2.5" opacity=".4"/><circle cx="314" cy="98" r="2.5" opacity=".4"/>
      <rect x="82" y="115" width="12" height="9" rx="1.5" stroke="var(--vscode-foreground, #cccccc)" stroke-width="1.4" fill="none"/>
      <rect x="102" y="119.5" width="104" height="5" rx="2.5" opacity=".8"/>
    </g>
  </g>
</g>
<rect x=".5" y=".5" width="399" height="249" rx="6" stroke="var(--vscode-panel-border, #80808059)"/>
</svg>
